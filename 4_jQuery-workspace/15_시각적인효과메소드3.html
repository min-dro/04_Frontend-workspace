<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시각적인 효과 메소드 3</title>
    <!-- 온라인 방식 -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <style>
        /* 질문을 담고 있는 div 요소들에게 스타일 주기 */
        div {
            background-color : begie;
            width : 350px;
            height : 35px;
            line-height : 35px;
            padding : 5px;
            border : 1px solid lightgray;
            border-radius : 10px;
            cursor : pointer;
        }

        /* 답변을 담고 있는 p 요소들에게 스타일 주기 */
        p {
            border : 1px solid lightgray;
            margin-top : 5px;
            width : 350px;
            height : 100px;
            padding : 5px;
            border-radius : 10px;
            display : none;
        }
    </style>
</head>
<body>
    
    <!--
        * slideDown() 과 slideUp()

        - 서서히 아래로 내려오면서 나타나고
          서서히 위로 올라가면서 사라지는 메소드

        - 자주 사용하는 예시로 연습해보자!! (쇼핑몰 FAQ 의 예시)

        * FAQ

        - Frequently Asked Question

        - 자주 묻는 질문
    -->

    <h2>FAQ</h2>

    <!-- 질문은 div 요소에, 답면은 p 요소에 표현해보기 -->

    <div>
        Q. 반품 언제되나요?
    </div>
    <p>
        A. 반품 요청일로부터 7일 이내로 처리됩니다.
    </p>

    <div>
        Q. 배송중인 상품 위치를 알고 싶습니다.
    </div>
    <p>
        A. 배송 조회를 해보세요. 거기 다 나와요.
    </p>

    <div>
        Q. 이 사이즈 있나요?
    </div>
    <p>
        A. 네 있어요 ^^
    </p>

    <div>
        Q. 전화 통화 가능한 시간을 알려주세요.
    </div>
    <p>
        A. 플러스친구 카톡을 활용하면 24시간 내로 답변 드리겠습니다.
    </p>

    <div>
        Q. 판매자가 연락이 안됩니다.
    </div>
    <p>
        A. 경찰에 신고하세요.
    </p>

    <script>
        $(function() {

            // 질문을 나타내는 div 요소에 클릭이벤트 걸기
            $("div").click(function() {

                // console.log($(this)); // 현재 클릭당한 div (target)
                // console.log($(this).next()); // 현재 클릭당한 div 기준 답변에 해당하는 p

                // p 요소를 변수에 담기
                let $p = $(this).next();
                // > jQuery 방식으로 선택된 요소를 변수에 담을 때
                //   보통 변수명 앞에 $ 를 붙여서 명명한다!! (명명규칙)
                
                // 왜? jQuery 방식으로 선택된 요소 객체임을 티내기 위해서!!
                // $p 기준으로 효과를 주고 싶으면? $p.jQuery메소드();

                // console.log($p.css("display")); // "none" / "block"
                // > css 메소드 또한 속성명만 인자값으로 전달해서 호춯하면
                //   해당 스타일 속성값을 반환해준다!!
                //   (css 메소드도 마찬가지로 setter / getter 메소드 역할을 모두 해줌)

                if($p.css("display") == "none") {
                    // > 답변이 보이지 않을 경우 (답변이 아직 안열려있을 경우)

                    // 이번 답변이 열리기 전에
                    // 기존에 열려있었던 답변들을 모두 닫아주기 (옵션)
                    $(this).siblings("p").slideUp(1000);

                    // 답변이 보여져야함
                    $p.slideDown(1000);
                    // > 1초동안 서서히 내려오면서 나타남 (1000ms)
                    
                } else {
                    // > 답변이 보일 경우 (답변이 열려있을 경우)

                    // 답변이 사라져야함
                    $p.slideUp(1000);
                    // > 1초 동안 서서히 올라가면서 사라짐 (1000ms)
                }

            });

        });
    </script>

</body>
</html>
